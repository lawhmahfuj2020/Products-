<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Shop Price Scanner</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0a0a0a;--s1:#141414;--s2:#1e1e1e;--border:#2a2a2a;--text:#f0f0f0;--muted:#666;--accent:#6366f1;--green:#22c55e;--yellow:#f59e0b;--red:#ef4444;--r:12px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--s1);border-top:1px solid var(--border);display:flex;height:64px}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:none;color:var(--muted);font-size:10px;cursor:pointer}
.nb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nb.active{color:var(--accent)}
.page{position:fixed;inset:0;bottom:64px;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.page.active{display:block}

/* SCANNER */
#page-scanner{background:#000;overflow:hidden}
#video{width:100%;height:100%;object-fit:cover;display:block}
#canvas{display:none}
#scan-ui{position:absolute;inset:0;pointer-events:none}
#status-bar{position:absolute;top:10%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.65);color:#fff;font-size:12px;padding:6px 16px;border-radius:20px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:blink 1s infinite;flex-shrink:0}
.dot.blue{background:var(--accent);animation:blink 0.5s infinite}
.dot.gray{background:var(--muted);animation:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
#scan-box{position:absolute;top:18%;left:8%;right:8%;bottom:28%}
.sc{position:absolute;width:28px;height:28px}
.sc.tl{top:0;left:0;border-top:3px solid #fff;border-left:3px solid #fff;border-radius:3px 0 0 0}
.sc.tr{top:0;right:0;border-top:3px solid #fff;border-right:3px solid #fff;border-radius:0 3px 0 0}
.sc.bl{bottom:0;left:0;border-bottom:3px solid #fff;border-left:3px solid #fff;border-radius:0 0 0 3px}
.sc.br{bottom:0;right:0;border-bottom:3px solid #fff;border-right:3px solid #fff;border-radius:0 0 3px 0}
#scan-line{position:absolute;left:8%;right:8%;height:2px;background:rgba(99,102,241,0.85);box-shadow:0 0 10px rgba(99,102,241,0.9);animation:sl 2.5s ease-in-out infinite}
@keyframes sl{0%{top:18%}50%{top:72%}100%{top:18%}}
#scan-hint{position:absolute;bottom:30%;left:50%;transform:translateX(-50%);font-size:12px;color:rgba(255,255,255,0.5);white-space:nowrap}
#result-panel{position:absolute;bottom:0;left:0;right:0;background:rgba(10,10,10,0.97);border-top:1px solid var(--border);border-radius:20px 20px 0 0;padding:16px;transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.34,1.4,0.64,1);pointer-events:all}
#result-panel.show{transform:translateY(0)}
.rhandle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px}
.rrow{display:flex;gap:14px;align-items:flex-start}
#r-img{width:88px;height:88px;border-radius:10px;object-fit:cover;background:var(--s2);flex-shrink:0;border:1px solid var(--border)}
.rinfo{flex:1;min-width:0}
#r-name{font-size:16px;font-weight:700;margin-bottom:4px}
#r-cat{font-size:11px;color:var(--muted);margin-bottom:8px}
#r-sell{font-size:32px;font-weight:700;color:var(--green);line-height:1}
.r-sell-label{font-size:10px;color:var(--muted);margin-bottom:2px}
.prow{display:flex;gap:8px;margin-top:12px}
.pbox{flex:1;background:var(--s2);border-radius:8px;padding:10px 12px;border:1px solid var(--border)}
.pbox-label{font-size:10px;color:var(--muted);margin-bottom:3px}
.pbox-val{font-size:17px;font-weight:700}
#r-code{color:var(--yellow)}
#r-purchase{color:var(--accent)}
#r-conf{font-size:11px;color:var(--muted);margin-top:10px;text-align:center}
#r-close{width:100%;margin-top:12px;padding:12px;background:var(--s2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-weight:600;cursor:pointer}
#no-match{position:absolute;bottom:0;left:0;right:0;background:rgba(10,10,10,0.95);border-radius:20px 20px 0 0;padding:24px;text-align:center;transform:translateY(100%);transition:transform 0.3s;pointer-events:all}
#no-match.show{transform:translateY(0)}
#no-match p{color:var(--muted);font-size:13px;margin-top:6px}

/* ADD */
#page-add{background:var(--bg);padding:16px;padding-bottom:24px}
.ptitle{font-size:20px;font-weight:700;margin-bottom:16px}
.card{background:var(--s1);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--border)}
.ctitle{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:0.5px}
.field{margin-bottom:11px}
.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}
.field input{width:100%;background:var(--s2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:11px 12px;font-size:15px;outline:none;-webkit-appearance:none}
.field input:focus{border-color:var(--accent)}
.photo-area{width:100%;aspect-ratio:4/3;background:var(--s2);border:2px dashed var(--border);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;position:relative;overflow:hidden}
.photo-area img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-area span{font-size:13px;color:var(--muted);position:relative;z-index:1}
.photo-area svg{width:30px;height:30px;stroke:var(--muted);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;position:relative;z-index:1}
#file-input{display:none}
.code-box{background:var(--s2);border-radius:8px;padding:11px 12px;font-size:16px;color:var(--yellow);font-weight:700;min-height:42px;border:1px solid var(--border)}
.btn{width:100%;padding:14px;border-radius:10px;border:none;font-size:16px;font-weight:700;cursor:pointer}
.btn:active{opacity:0.85}
.btn-primary{background:var(--accent);color:#fff}

/* PRODUCTS */
#page-products{background:var(--bg);padding:16px}
.search-wrap{position:relative;margin-bottom:14px}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#search{width:100%;background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:11px 12px 11px 36px;color:var(--text);font-size:15px;outline:none}
#search:focus{border-color:var(--accent)}
.pitem{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:10px}
.pitem img{width:60px;height:60px;border-radius:8px;object-fit:cover;background:var(--s2);flex-shrink:0}
.pitem-info{flex:1;min-width:0}
.pitem-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem-prices{display:flex;gap:10px;margin-top:3px;font-size:12px}
.sp{color:var(--green);font-weight:700}
.cp{color:var(--yellow)}
.pitem-cat{font-size:11px;color:var(--muted);margin-top:2px}
.pitem-del{background:none;border:none;color:var(--muted);padding:8px;cursor:pointer;flex-shrink:0}
.pitem-del svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* TOAST */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--s2);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:9px 20px;font-size:13px;opacity:0;transition:all 0.25s;z-index:999;white-space:nowrap;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:var(--green);color:var(--green)}
#toast.err{border-color:var(--red);color:var(--red)}

/* LOADER */
#loader{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;z-index:500;flex-direction:column;gap:12px}
.spin{width:38px;height:38px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loader-msg{color:var(--muted);font-size:13px}
</style>
</head>
<body>

<div id="page-scanner" class="page active">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>
  <div id="scan-ui">
    <div id="status-bar"><div class="dot gray" id="dot"></div><span id="stext">Starting…</span></div>
    <div id="scan-box">
      <div class="sc tl"></div><div class="sc tr"></div>
      <div class="sc bl"></div><div class="sc br"></div>
    </div>
    <div id="scan-line"></div>
    <div id="scan-hint">Hold product inside the frame</div>
  </div>
  <div id="result-panel">
    <div class="rhandle"></div>
    <div class="rrow">
      <img id="r-img" src="" alt="">
      <div class="rinfo">
        <div id="r-name">—</div>
        <div id="r-cat"></div>
        <div class="r-sell-label">Selling price</div>
        <div id="r-sell">৳—</div>
      </div>
    </div>
    <div class="prow">
      <div class="pbox"><div class="pbox-label">Secret code</div><div class="pbox-val" id="r-code">—</div></div>
      <div class="pbox"><div class="pbox-label">Purchase price</div><div class="pbox-val" id="r-purchase">৳—</div></div>
    </div>
    <div id="r-conf"></div>
    <button id="r-close">Scan next product</button>
  </div>
  <div id="no-match">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <p>No match found — try again</p>
  </div>
</div>

<div id="page-add" class="page">
  <div class="ptitle">Add product</div>
  <div class="card">
    <div class="ctitle">Product photo</div>
    <div class="photo-area" id="photo-area">
      <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      <span>Tap to take or upload photo</span>
      <img id="photo-preview" src="" style="display:none">
    </div>
    <input type="file" id="file-input" accept="image/*" capture="environment">
  </div>
  <div class="card">
    <div class="ctitle">Details</div>
    <div class="field"><label>Product name</label><input type="text" id="inp-name" placeholder="e.g. Rose Perfume 50ml"></div>
    <div class="field"><label>Category (optional)</label><input type="text" id="inp-cat" placeholder="e.g. Cosmetics, Toys, Home…"></div>
    <div class="field"><label>Selling price (৳)</label><input type="number" id="inp-sell" placeholder="e.g. 350"></div>
    <div class="field"><label>Purchase price (৳)</label><input type="number" id="inp-buy" placeholder="e.g. 250"></div>
    <div class="field"><label>Secret code (auto)</label><div class="code-box" id="code-box">—</div></div>
  </div>
  <button class="btn btn-primary" id="save-btn">Save product</button>
  <div id="save-msg" style="text-align:center;font-size:13px;margin-top:10px;min-height:18px;color:var(--muted)"></div>
</div>

<div id="page-products" class="page">
  <div class="ptitle">Products</div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input id="search" type="text" placeholder="Search by name or category…">
  </div>
  <div id="products-list"></div>
</div>

<nav id="nav">
  <button class="nb active" id="nav-scanner">
    <svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg>
    Scanner
  </button>
  <button class="nb" id="nav-add">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    Add
  </button>
  <button class="nb" id="nav-products">
    <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    Products
  </button>
</nav>

<div id="toast"></div>
<div id="loader" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);align-items:center;justify-content:center;z-index:500;flex-direction:column;gap:12px">
  <div class="spin"></div>
  <div id="loader-msg" style="color:#666;font-size:13px">Please wait…</div>
</div>

<script>
const SB_URL = 'https://yhgnorvhjeotjotgdkkd.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InloZ25vcnZoamVvdGpvdGdka2tkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5NTYxNjMsImV4cCI6MjA5MzUzMjE2M30.fLDr5UQ_oJkbipDs-65JouE2JZF0ia95BRzpxF2TzRc';
const CL_NAME = 'puwnwpvq';
const CL_PRESET = 'txhi9mym';

const ENC = {'1':'V','2':'M','3':'S','4':'L','5':'K','6':'N','7':'Y','8':'P','9':'R','0':'T'};
const DEC = {'V':'1','M':'2','S':'3','L':'4','K':'5','N':'6','Y':'7','P':'8','R':'9','T':'0'};
const encode = p => String(p).split('').map(d => ENC[d]||d).join('');
const decode = c => String(c).toUpperCase().split('').map(x => DEC[x]||x).join('');

const db = supabase.createClient(SB_URL, SB_KEY);

// TOAST
let toastTimer;
function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 3000);
}

// LOADER
function setLoader(v, msg) {
  const l = document.getElementById('loader');
  l.style.display = v ? 'flex' : 'none';
  if (msg) document.getElementById('loader-msg').textContent = msg;
}

// SECRET CODE
document.getElementById('inp-buy').addEventListener('input', function() {
  document.getElementById('code-box').textContent = this.value ? encode(this.value) : '—';
});

// PHOTO
let selectedFile = null;
document.getElementById('photo-area').addEventListener('click', function() {
  document.getElementById('file-input').click();
});
document.getElementById('file-input').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  selectedFile = file;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = document.getElementById('photo-preview');
    img.src = ev.target.result;
    img.style.display = 'block';
    document.querySelector('#photo-area span').style.display = 'none';
    document.querySelector('#photo-area > svg').style.display = 'none';
  };
  reader.readAsDataURL(file);
});

// RESIZE AND STORE AS BASE64 - no upload needed
function resizeToBase64(file) {
  return new Promise(function(resolve) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        var canvas = document.createElement("canvas");
        var w = img.width, h = img.height, max = 200;
        if (w > h && w > max) { h = Math.round(h * max / w); w = max; }
        else if (h > max) { w = Math.round(w * max / h); h = max; }
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.5));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
async function uploadImage(file) { return await resizeToBase64(file); }

// SAVE PRODUCT
document.getElementById('save-btn').addEventListener('click', async function() {
  const name = document.getElementById('inp-name').value.trim();
  const sell = document.getElementById('inp-sell').value.trim();
  const buy = document.getElementById('inp-buy').value.trim();
  const cat = document.getElementById('inp-cat').value.trim();

  if (!name || !sell || !buy || !selectedFile) {
    toast('Fill all fields and add a photo', 'err');
    return;
  }

  setLoader(true, 'Uploading photo…');
  try {
    let imageUrl;
    try {
      imageUrl = await uploadImage(selectedFile);
    } catch(uploadErr) {
      throw new Error('Photo upload failed: ' + uploadErr.message);
    }
    setLoader(true, 'Saving product…');
    const res = await db.from('products').insert({
      name: name,
      selling_price: parseFloat(sell),
      purchase_code: encode(buy),
      image_url: imageUrl,
      category: cat || null
    });
    if (res.error) throw new Error('Database error: ' + res.error.message);
    toast('Product saved!', 'ok');
    document.getElementById('inp-name').value = '';
    document.getElementById('inp-sell').value = '';
    document.getElementById('inp-buy').value = '';
    document.getElementById('inp-cat').value = '';
    document.getElementById('code-box').textContent = '—';
    document.getElementById('photo-preview').style.display = 'none';
    document.querySelector('#photo-area span').style.display = '';
    document.querySelector('#photo-area > svg').style.display = '';
    selectedFile = null;
    await loadAllProducts();
  } catch(e) {
    toast('Error: ' + e.message, 'err');
  }
  setLoader(false);
});

// NAV
function goPage(name) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.querySelectorAll('.nb').forEach(function(b) { b.classList.remove('active'); });
  document.getElementById('page-' + name).classList.add('active');
  document.getElementById('nav-' + name).classList.add('active');
  if (name === 'scanner') startScanner();
  else stopScanner();
  if (name === 'products') loadProducts();
}

document.getElementById('nav-scanner').addEventListener('click', function() { goPage('scanner'); });
document.getElementById('nav-add').addEventListener('click', function() { goPage('add'); });
document.getElementById('nav-products').addEventListener('click', function() { goPage('products'); });
document.getElementById('r-close').addEventListener('click', function() { closeResult(); });

// SCANNER
let scanStream = null, scanTimer = null, scanning = false, resultVisible = false;
let allProducts = [];

async function loadAllProducts() {
  const res = await db.from('products').select('*');
  allProducts = res.data || [];
}

async function startScanner() {
  await loadAllProducts();
  if (scanStream) return;
  const video = document.getElementById('video');
  const dot = document.getElementById('dot');
  const stext = document.getElementById('stext');
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 960 } },
      audio: false
    });
    video.srcObject = scanStream;
    await video.play();
    dot.className = 'dot';
    stext.textContent = 'Scanning…';
    scanning = true;
    scanTimer = setTimeout(doScan, 1500);
  } catch(e) {
    stext.textContent = 'Camera unavailable';
    dot.className = 'dot gray';
  }
}

function stopScanner() {
  scanning = false;
  clearTimeout(scanTimer);
  if (scanStream) {
    scanStream.getTracks().forEach(function(t) { t.stop(); });
    scanStream = null;
  }
}

function captureBase64() {
  const v = document.getElementById('video');
  const c = document.getElementById('canvas');
  c.width = v.videoWidth || 640;
  c.height = v.videoHeight || 480;
  c.getContext('2d').drawImage(v, 0, 0);
  return c.toDataURL('image/jpeg', 0.75).split(',')[1];
}

function getFingerprint(imageElement) {
  const c = document.createElement('canvas');
  c.width = 16; c.height = 16;
  const ctx = c.getContext('2d');
  ctx.drawImage(imageElement, 0, 0, 16, 16);
  const d = ctx.getImageData(0, 0, 16, 16).data;
  const fp = [];
  for (let i = 0; i < d.length; i += 4) fp.push((d[i] + d[i+1] + d[i+2]) / 3);
  return fp;
}

function getFingerprintFromBase64(base64) {
  return new Promise(function(resolve) {
    const img = new Image();
    img.onload = function() { resolve(getFingerprint(img)); };
    img.src = 'data:image/jpeg;base64,' + base64;
  });
}

function getFingerprintFromUrl(url) {
  return new Promise(function(resolve) {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() {
      try { resolve(getFingerprint(img)); }
      catch(e) { resolve(null); }
    };
    img.onerror = function() { resolve(null); };
    img.src = url.replace('/upload/', '/upload/w_32,h_32,c_fill/');
  });
}

function similarity(a, b) {
  if (!a || !b || a.length !== b.length) return 0;
  let diff = 0;
  for (let i = 0; i < a.length; i++) diff += Math.abs(a[i] - b[i]);
  return 1 - (diff / (255 * a.length));
}

async function doScan() {
  if (!scanning || resultVisible || allProducts.length === 0) {
    if (scanning && !resultVisible) scanTimer = setTimeout(doScan, 2000);
    return;
  }
  const dot = document.getElementById('dot');
  const stext = document.getElementById('stext');
  dot.className = 'dot blue';
  stext.textContent = 'Matching…';

  try {
    const base64 = captureBase64();
    const camFP = await getFingerprintFromBase64(base64);
    let bestMatch = null, bestScore = 0;
    for (let i = 0; i < allProducts.length; i++) {
      const p = allProducts[i];
      const pFP = await getFingerprintFromUrl(p.image_url);
      if (!pFP) continue;
      const score = similarity(camFP, pFP);
      if (score > bestScore) { bestScore = score; bestMatch = p; }
    }
    if (bestMatch && bestScore >= 0.72) {
      showResult(bestMatch, bestScore);
    } else {
      showNoMatch();
      scanTimer = setTimeout(doScan, 2000);
    }
  } catch(e) {
    scanTimer = setTimeout(doScan, 2500);
  }

  dot.className = 'dot';
  stext.textContent = 'Scanning…';
}

function showResult(p, score) {
  resultVisible = true;
  document.getElementById('no-match').classList.remove('show');
  document.getElementById('r-img').src = p.image_url;
  document.getElementById('r-name').textContent = p.name;
  document.getElementById('r-cat').textContent = p.category || '';
  document.getElementById('r-sell').textContent = '৳' + p.selling_price;
  document.getElementById('r-code').textContent = p.purchase_code;
  document.getElementById('r-purchase').textContent = '৳' + decode(p.purchase_code);
  document.getElementById('r-conf').textContent = 'Match confidence: ' + Math.round(score * 100) + '%';
  document.getElementById('result-panel').classList.add('show');
}

function showNoMatch() {
  document.getElementById('result-panel').classList.remove('show');
  const nm = document.getElementById('no-match');
  nm.classList.add('show');
  setTimeout(function() { nm.classList.remove('show'); }, 2000);
}

function closeResult() {
  resultVisible = false;
  document.getElementById('result-panel').classList.remove('show');
  scanTimer = setTimeout(doScan, 1000);
}

// PRODUCTS LIST
let allCache = [];
async function loadProducts() {
  const list = document.getElementById('products-list');
  list.innerHTML = '<div style="color:#666;text-align:center;padding:24px">Loading…</div>';
  const res = await db.from('products').select('*').order('created_at', { ascending: false });
  allCache = res.data || [];
  renderProducts(allCache);
}

function renderProducts(arr) {
  const list = document.getElementById('products-list');
  if (!arr.length) {
    list.innerHTML = '<div style="text-align:center;color:#666;padding:48px 20px;font-size:14px">No products yet.<br>Add from the Add tab.</div>';
    return;
  }
  list.innerHTML = arr.map(function(p) {
    return '<div class="pitem">' +
      '<img src="' + p.image_url + '" alt="' + p.name + '" onerror="this.style.opacity=0.3">' +
      '<div class="pitem-info">' +
        '<div class="pitem-name">' + p.name + '</div>' +
        '<div class="pitem-prices"><span class="sp">৳' + p.selling_price + '</span><span class="cp">' + p.purchase_code + ' = ৳' + decode(p.purchase_code) + '</span></div>' +
        (p.category ? '<div class="pitem-cat">' + p.category + '</div>' : '') +
      '</div>' +
      '<button class="pitem-del" data-id="' + p.id + '">' +
        '<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>' +
      '</button>' +
    '</div>';
  }).join('');

  document.querySelectorAll('.pitem-del').forEach(function(btn) {
    btn.addEventListener('click', function() { delProduct(this.dataset.id); });
  });
}

document.getElementById('search').addEventListener('input', function() {
  const q = this.value.toLowerCase();
  renderProducts(allCache.filter(function(p) {
    return p.name.toLowerCase().includes(q) || (p.category || '').toLowerCase().includes(q);
  }));
});

async function delProduct(id) {
  if (!confirm('Delete this product?')) return;
  const res = await db.from('products').delete().eq('id', id);
  if (res.error) { toast('Delete failed', 'err'); return; }
  toast('Deleted', 'ok');
  loadProducts();
  loadAllProducts();
}

startScanner();
